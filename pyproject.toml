[project]
name = "intro-cloud-mlops"
version = "0.1.0"
description = "Floci demos for an AWS/MLOps masterclass"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "nbclient>=0.10", "ipykernel>=6.29"]
notebook = ["euporie>=2.8", "ipykernel>=6.29", "jupyter-client>=8.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

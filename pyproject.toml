[project]
name = "intro-cloud-mlops"
version = "0.1.0"
description = "Intro to the cloud for ML engineers: hands-on tutorials on Floci"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

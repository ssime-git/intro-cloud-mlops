services:
  floci:
    # Pinned to the version this demo was validated against. Bump deliberately.
    image: floci/floci:2.1.0
    container_name: floci
    user: root
    ports:
      # Bound to loopback only: 4566 exposes an emulator with no auth by
      # default and this stack is meant for local demo use, not to be
      # reachable from the network.
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_SERVICES_DOCKER_NETWORK: floci_default
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "${FLOCI_IAM_ENFORCEMENT:-false}"
    volumes:
      # Required so Floci can launch the Lambda runtime containers itself
      # (sibling-container pattern). This effectively grants the floci
      # container root access to the Docker host — only run trusted images
      # this way, and keep it to local/demo environments.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - floci_default

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runner
    command: sleep infinity
    working_dir: /work
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      FLOCI_ENDPOINT: http://floci:4566
    volumes:
      - .:/work
    networks:
      - floci_default
    depends_on:
      - floci

networks:
  floci_default:
    name: floci_default
